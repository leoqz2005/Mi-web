<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>¡Feliz Cumpleaños Rouss! 20 Años</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Baloo+2:wght@500;700;800&family=Poppins:ital,wght@0,300;0,400;0,600;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fondo de estrellas / espacio -->
  <div class="starfield" aria-hidden="true"></div>

  <main class="salon" id="salon">

    <!-- ===================== PIZARRA ===================== -->
    <section class="pizarra-wrap">
      <div class="pizarra">
        <div class="marco-pizarra"></div>

        <!-- banderines -->
        <div class="guirnalda guirnalda-izq" aria-hidden="true">
          <div class="cuerda"></div>
          <div class="banderines">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>
        <div class="guirnalda guirnalda-der" aria-hidden="true">
          <div class="cuerda"></div>
          <div class="banderines">
            <span></span><span></span><span></span><span></span><span></span><span></span>
          </div>
        </div>

        <!-- planetas y galaxia -->
        <div class="cielo" aria-hidden="true">
          <div class="estrella e1"></div>
          <div class="estrella e2"></div>
          <div class="estrella e3"></div>
          <div class="estrella e4"></div>
          <div class="estrella e5"></div>
          <div class="estrella e6"></div>
          <div class="estrella e7"></div>
          <div class="estrella e8"></div>

          <div class="planeta planeta-rojo"><span class="anillo"></span></div>
          <div class="planeta planeta-azul"><span class="anillo"></span></div>
          <div class="planeta planeta-morado"><span class="anillo"></span></div>
          <div class="planeta planeta-dorado"><span class="anillo"></span></div>
          <div class="planeta planeta-verde"></div>
          <div class="asteroide a1"></div>
          <div class="asteroide a2"></div>
          <div class="cohete">
            <div class="cohete-cuerpo"></div>
            <div class="cohete-flama"></div>
          </div>
        </div>

        <!-- texto tiza -->
        <div class="texto-tiza">
          <p class="linea-1">¡Feliz Cumpleaños!</p>
          <p class="linea-2">ROUSS</p>
          <p class="linea-3">20 <span>Años</span></p>
        </div>
      </div>

      <!-- listado de reglas, como en la foto -->
      <div class="cartel-reglas" aria-hidden="true">
        <p class="titulo-reglas">REGLAS</p>
        <p>1. Respeta</p>
        <p>2. Escucha</p>
        <p>3. Participa</p>
        <p>4. Esfuérzate</p>
        <p>5. Sé amable ♥</p>
      </div>
    </section>

    <!-- ===================== SALÓN ===================== -->
    <section class="escenario">

      <!-- globos: ramo con varios colores y tamaños, como un bouquet real -->
      <div class="ramo-globos ramo-izq" aria-hidden="true">
        <span class="globo rosa g1"></span>
        <span class="globo azul g2"></span>
        <span class="globo dorado g3"></span>
        <span class="globo morado g4"></span>
        <span class="globo verde g5"></span>
        <span class="globo coral g6"></span>
      </div>
      <div class="ramo-globos ramo-der" aria-hidden="true">
        <span class="globo dorado g1"></span>
        <span class="globo morado g2"></span>
        <span class="globo rosa g3"></span>
        <span class="globo azul g4"></span>
        <span class="globo coral g5"></span>
        <span class="globo verde g6"></span>
      </div>

      <!-- confeti que cae al soplar las velas -->
      <div class="confeti-contenedor" id="confeti-contenedor" aria-hidden="true"></div>

      <!-- mesa central de honor -->
      <div class="mesa-central">

        <!-- caja de regalo con moño rosa (a un lado, como en la foto) -->
        <div class="regalito" aria-hidden="true">
          <div class="regalito-tapa"></div>
          <div class="regalito-cuerpo"></div>
          <div class="regalito-lazo"></div>
        </div>


        <div class="plato plato-der" id="plato-der">
          <div class="plato-base"></div>
          <div class="tajada">
            <div class="tajada-bizcocho"></div>
            <div class="tajada-relleno"></div>
          </div>
          <div class="tenedor"></div>
        </div>

        <!-- escenario interactivo: torta -> regalo -->
        <div class="escena-interactiva" id="escena-interactiva" role="button" tabindex="0" aria-label="Torta de cumpleaños interactiva">

          <!-- TORTA -->
          <div class="torta" id="torta">
            <div class="topper">Feliz<br>Cumpleaños</div>
            <div class="capa capa-superior">
              <div class="goteo" aria-hidden="true"></div>
              <div class="frutas" aria-hidden="true">
                <span class="fresa"></span><span class="fresa"></span><span class="fresa"></span>
                <span class="mora"></span><span class="mora"></span><span class="mora"></span>
                <span class="mora"></span><span class="mora"></span>
              </div>
              <div class="velas" id="velas"></div>
            </div>
            <div class="capa capa-inferior">
              <div class="rosetones" aria-hidden="true"></div>
            </div>
            <div class="plato-torta"></div>
          </div>

          <!-- REGALO FINAL (aparece luego del deseo) -->
          <div class="regalo-final" id="regalo-final">
            <div class="regalo-final-tapa"></div>
            <div class="regalo-final-cuerpo"></div>
            <div class="regalo-final-lazo-v"></div>
            <div class="regalo-final-lazo-h"></div>
            <div class="regalo-final-moño"></div>
            <div class="brillo brillo-1"></div>
            <div class="brillo brillo-2"></div>
            <div class="brillo brillo-3"></div>
          </div>
        </div>

        <!-- foto de Rouss encima de la mesa, al costado de la torta -->
        <div class="foto-rouss">
          <img src="rouss.png" alt="Rouss" onerror="this.style.display='none'">
        </div>

        <div class="mesa-tablero"></div>
        <div class="mesa-mantel"></div>
        <div class="mesa-patas"><span></span><span></span></div>
      </div>

      <!-- cartel luminoso "ERES INCREÍBLE" — superpuesto delante de la mesa -->
      <div class="letrero">
        <div class="letrero-fila">
          <span>E</span><span>R</span><span>E</span><span>S</span>
        </div>
        <div class="letrero-fila">
          <span>I</span><span>N</span><span>C</span><span>R</span><span>E</span><span>Í</span><span>B</span><span>L</span><span>E</span>
        </div>
        <div class="letrero-corazon">♥</div>
      </div>

      <!-- texto guía de interacción -->
      <div class="guia-interaccion" id="guia-interaccion">
        <p id="texto-guia">Toca la torta para encender las velas 🕯️</p>
        <div class="contador-deseo" id="contador-deseo" hidden>
          <span id="numero-contador">20</span>
          <small>segundos para tu deseo…</small>
        </div>
      </div>

    </section>
  </main>

  <!-- ===================== MODAL CARTA ===================== -->
  <div class="carta-overlay" id="carta-overlay" hidden>
    <div class="carta" id="carta">
      <button class="carta-cerrar" id="carta-cerrar" aria-label="Cerrar carta">✕</button>
      <div class="carta-sello">✦</div>
      <h2 class="carta-titulo">Para Rouss</h2>
      <!-- ✍️ EDITA AQUÍ TU MENSAJE PERSONAL, en script.js dentro de la variable MENSAJE_CARTA -->
      <p class="carta-texto" id="carta-texto"></p>
      <p class="carta-firma">Con cariño, Leonardo</p>
    </div>
  </div>

  <!-- audio de cumpleaños: coloca tu canción en assets/cancion.mp3 -->
  <audio id="audio-cumple" src="Parchís - Cumpleaños feliz.mp3" preload="none" loop></audio>

  <script src="script.js"></script>
</body>
</html>
